server:
  port: 8091

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27018/lendercore
    redis:
      host: localhost
      port: 6379

flow:
  enabled: true
  registry:
    mode: mongo
    cache:
      enabled: true
      version-ttl: 1h
      pointer-ttl: 10s
  temporal:
    task-queue: lih-l2
    target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    api-key: ${TEMPORAL_API_KEY:}
    tls-cert-path: ${TEMPORAL_TLS_CERT:}
    tls-key-path: ${TEMPORAL_TLS_KEY:}
  api:
    key: ${FLOW_API_KEY:}
    callback-secret: ${FLOW_CALLBACK_SECRET:}
    callbacks:
      YUBI_TIMBLE_STATUS:
        event-name: timbleCallback
        workflow-id-prefix: axis-precheck-decomposed-
        customer-id-field: customer_id
        lender-slug: axis

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: lih
