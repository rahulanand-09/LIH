# L1 config pipeline (docs/l1-config-publishing.md):
#   pull request  -> tests + validate against the QA registry (schema, refs, CEL, dataflow, versions, golden)
#   merge         -> publish to QA
#   manual        -> publish to prod (protect the "l1-prod" environment with required reviewers)
name: l1-config

on:
  pull_request:
    paths:
      - "src/main/resources/l1-config/**"
      - "src/main/resources/l1-schemas/**"
      - "src/main/java/com/rupeek/l1/**"
      - "pom.xml"
  push:
    branches: [master]
    paths:
      - "src/main/resources/l1-config/**"
      - "src/main/resources/l1-schemas/**"
      - "src/main/java/com/rupeek/l1/**"
      - "pom.xml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this config goes to prod"
        required: true

concurrency:
  group: l1-config-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, executor and engine tests (Testcontainers needs Docker, present on ubuntu runners)
        run: mvn -B test
      - name: Validate config against the QA registry
        env:
          # Without the secret (e.g. forks) validation runs offline: no version checks.
          L1_CONFIG_MONGO_URI: ${{ secrets.L1_CONFIG_MONGO_URI_QA }}
        run: mvn -B -q compile exec:java -Dexec.args="validate --env qa"

  publish-qa:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: l1-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Publish to QA
        env:
          L1_CONFIG_MONGO_URI: ${{ secrets.L1_CONFIG_MONGO_URI_QA }}
          L1_PUBLISH_REASON: ${{ github.event.head_commit.message }}
        run: mvn -B -q compile exec:java -Dexec.args="publish --env qa --by ${{ github.actor }}"

  publish-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: l1-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Publish to prod
        env:
          L1_CONFIG_MONGO_URI: ${{ secrets.L1_CONFIG_MONGO_URI_PROD }}
          L1_PUBLISH_REASON: ${{ inputs.reason }}
        run: mvn -B -q compile exec:java -Dexec.args="publish --env prod --by ${{ github.actor }}"
